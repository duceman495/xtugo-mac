<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XTU GO · 相机内容</title>
<style>
  :root{
    --bg:#f5f5f7; --panel:#fff; --panel-2:#fafafa; --text:#1d1d1f; --muted:#6e6e73;
    --line:#e3e3e8; --accent:#0071e3; --accent-2:#0a84ff; --ok:#1f9d55; --warn:#c2410c;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 30px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161618; --panel:#1f1f22; --panel-2:#242427; --text:#f5f5f7; --muted:#a1a1a6;
           --line:#333338; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 30px rgba(0,0,0,.5); }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:22px 22px 80px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(140deg,#0a84ff,#5e5ce6);
        display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;letter-spacing:-.5px}
  h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.2px}
  .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .grow{flex:1}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
        background:var(--panel);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  .dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(31,157,85,.14)}
  .dot.off{background:#c33}
  button,.btn{
    font:inherit;font-size:13px;padding:7px 13px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);cursor:pointer;transition:.14s;
  }
  button:hover,.btn:hover{background:var(--panel-2);border-color:#cfcfd6}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:var(--accent-2)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px}
  .seg button.active{background:var(--accent);color:#fff}
  input[type=search],input[type=text]{
    font:inherit;font-size:13px;padding:8px 11px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);outline:none;min-width:180px
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,132,255,.16)}
  .banner{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);
          border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .banner h3{margin:0 0 6px;font-size:14px}
  .banner code{background:rgba(127,127,127,.14);padding:1.5px 6px;border-radius:5px;font-size:12.5px}
  .banner ol{margin:8px 0 0 18px;padding:0;color:var(--muted);font-size:13px}
  .banner li{margin:3px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:14px}
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:13px;
        overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.16s}
  .card:hover{transform:translateY(-1px);border-color:#c9c9d1}
  .card.sel{outline:2px solid var(--accent);outline-offset:-1px}
  .thumb{position:relative;aspect-ratio:4/3;background:
      repeating-linear-gradient(45deg,var(--panel-2),var(--panel-2) 10px,var(--panel) 10px,var(--panel) 20px);
      display:grid;place-items:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .ph{color:var(--muted);display:grid;place-items:center;gap:6px;font-size:12px;
             position:absolute;inset:0}
  .thumb .ph svg{opacity:.55}
  .thumb.ok .ph{display:none}
  .badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;
         padding:2.5px 7px;border-radius:6px;backdrop-filter:blur(4px)}
  .pick{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;
        background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.18);display:grid;place-items:center;
        font-size:13px;color:transparent;backdrop-filter:blur(6px);opacity:0;transition:.14s}
  .card:hover .pick{opacity:1}
  .card.sel .pick{opacity:1;background:var(--accent);color:#fff;border-color:var(--accent)}
  .meta{padding:9px 11px 11px}
  .name{font-size:12.5px;font-weight:560;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .line2{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;margin-top:3px}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .skeleton{height:186px;border-radius:13px;background:linear-gradient(90deg,var(--panel),var(--panel-2),var(--panel));
            background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{0%{background-position:0 0}100%{background-position:-200% 0}}
  /* 灯箱 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;z-index:50;
         padding:32px;backdrop-filter:blur(6px)}
  .modal.on{display:grid}
  .modal .box{max-width:min(1040px,94vw);max-height:88vh;display:flex;flex-direction:column;gap:12px}
  .modal img,.modal video{max-width:100%;max-height:74vh;border-radius:12px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal .bar{display:flex;gap:10px;align-items:center;color:#fff;font-size:13px}
  .modal .bar .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modal .bar button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.2);color:#fff}
  .modal .bar button:hover{background:rgba(255,255,255,.24)}
  .nav{position:absolute;top:0;bottom:0;width:16%;display:grid;place-items:center;color:#fff;font-size:32px;
       cursor:pointer;opacity:0;transition:.15s;user-select:none}
  .modal.on .nav{opacity:.75}
  .nav:hover{opacity:1}
  .nav.l{left:0}.nav.r{right:0}
  /* 设置 */
  .sheet{background:var(--panel);border-radius:14px;padding:20px;width:min(460px,92vw);box-shadow:var(--shadow)}
  .sheet h3{margin:0 0 14px;font-size:15px}
  .sheet label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 6px}
  .sheet .row{display:flex;gap:8px}
  .sheet .row input{flex:1}
  .sheet .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
         background:rgba(30,30,32,.94);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;
         transition:.22s;z-index:99;pointer-events:none;max-width:80vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
       background:rgba(127,127,127,.15);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">XTU</div>
    <div>
      <h1>XTU GO · 相机内容</h1>
      <div class="sub" id="subtitle">正在检测相机…</div>
    </div>
    <div class="grow"></div>
    <span class="chip"><span class="dot" id="dot"></span><span id="connText">未连接</span></span>
    <span class="chip" id="camChip" style="display:none"></span>
    <button id="btnPreview" title="实时预览地址">预览</button>
    <button id="btnRefresh">刷新</button>
    <button id="btnDiag" title="诊断取文件链路">诊断</button>
    <button id="btnSettings" title="手动指定相机地址">设置</button>
  </header>

  <div id="banner"></div>

  <div class="toolbar">
    <div class="seg" id="seg">
      <button data-k="all" class="active">全部</button>
      <button data-k="photo">照片</button>
      <button data-k="video">视频</button>
    </div>
    <input type="search" id="q" placeholder="搜索文件名…">
    <div class="grow"></div>
    <span class="sub" id="count"></span>
    <button id="btnSelectAll">全选</button>
    <button id="btnDownloadSel" disabled>下载选中</button>
    <button id="btnDownloadAll">全部下载</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>
</div>

<!-- 灯箱 -->
<div class="modal" id="lightbox">
  <div class="nav l" id="navL">‹</div>
  <div class="nav r" id="navR">›</div>
  <div class="box">
    <div class="bar">
      <span class="t" id="lbTitle"></span>
      <button id="lbDownload">下载</button>
      <button id="lbClose">关闭</button>
    </div>
    <div id="lbBody"></div>
  </div>
</div>

<!-- 诊断 -->
<div class="modal" id="diag">
  <div class="sheet" style="width:min(760px,94vw)">
    <h3>诊断</h3>
    <div class="hint" id="diagHint">正在跑一遍取文件链路（探测 → 列表 → 8080 → HTTP）…</div>
    <pre id="diagOut" style="max-height:52vh;overflow:auto;background:var(--panel-2);border:1px solid var(--line);
         border-radius:10px;padding:12px;font-size:11.5px;line-height:1.5;white-space:pre-wrap;margin:12px 0 0"></pre>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="diagCopy">复制结果</button>
      <button id="diagAgain">重新诊断</button>
      <button id="diagClose">关闭</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="modal" id="settings">
  <div class="sheet">
    <h3>相机地址</h3>
    <div class="row">
      <input type="text" id="hostInput" placeholder="192.168.0.1">
      <button class="primary" id="hostSave">连接</button>
    </div>
    <div class="hint">
      留空表示自动探测（Wi-Fi 的 DHCP 路由器 → 192.168.0.1 → 192.168.1.1）。
      相机 AP 名通常以 <code>XTU / YUTU / 3516A / himc</code> 开头，默认密码 <code>12345678</code>。
    </div>
    <div class="hint" id="hostState"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const state = { items: [], kind: 'all', q: '', sel: new Set(), connected: false, lbIndex: -1 };

function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms);
}
function fmtDur(t) {
  const sec = Math.round(Number(t) || 0);
  if (!sec) return '';
  const m = Math.floor(sec / 60), r = sec % 60;
  return `${m}:${String(r).padStart(2, '0')}`;
}
function bytes(n) {
  n = Number(n) || 0;
  const u = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n.toFixed(0) : n.toFixed(n >= 100 ? 0 : 1)) + u[i];
}
async function api(url, opts) {
  const r = await fetch(url, opts);
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('json')) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.ok === false && j.error) throw new Error(j.error);
  return j;
}
window.__ph = (video) => video
  ? '<div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg><span>点击播放</span></div>'
  : '<div class="ph"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M3.6 17l5.2-5 4 3.6 3-2.6 4.6 4"/></svg><span>无缩略图</span></div>';

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }

/* ---------------- 状态 ---------------- */
async function refreshStatus() {
  let s;
  try { s = await api('/api/status'); } catch (e) { s = { connected: false, error: String(e) }; }
  state.connected = !!s.connected;
  $('#dot').className = 'dot ' + (s.connected ? 'on' : 'off');
  $('#connText').textContent = s.connected ? '已连接' : '未连接';
  const cam = $('#camChip');
  if (s.connected) {
    cam.style.display = '';
    cam.textContent = [s.name, s.type, s.softversion].filter(Boolean).join(' · ');
    $('#subtitle').textContent = `${s.host} · ${s.family || '相机'}` +
      (s.sd ? ' · SD ' + JSON.stringify(s.sd).replace(/[{}"]/g, ' ').trim() : '') +
      (s.battery ? ' · 电量 ' + JSON.stringify(s.battery).replace(/[{}"]/g, ' ').trim() : '');
    $('#banner').innerHTML = '';
    if (!state.items.length) loadFiles();
  } else {
    cam.style.display = 'none';
    $('#subtitle').textContent = '等待连接相机';
    $('#banner').innerHTML = `
      <div class="banner">
        <h3>还没有连上相机</h3>
        <ol>
          <li>打开相机，让它进入 Wi-Fi AP 模式（一般开机就是）。</li>
          <li>在 Mac 菜单栏连上相机的 Wi-Fi：<code>XTU…</code> / <code>YUTU…</code> / <code>3516A…</code>，默认密码 <code>12345678</code>。</li>
          <li>回到这里点「刷新」；相机地址一般是 <code>192.168.0.1</code>，也可以点「设置」手动填。</li>
        </ol>
        <div class="sub" style="margin-top:10px">当前 Wi-Fi：${esc(s.wifi_ssid || '未知')} · 网关：${esc(s.gateway || '未取到')}
        ${s.error ? ' · ' + esc(s.error.split('\n')[0]) : ''}</div>
      </div>`;
  }
}

/* ---------------- 文件列表 ---------------- */
async function loadFiles(force) {
  if (!state.connected) return;
  const grid = $('#grid');
  grid.innerHTML = Array.from({ length: 8 }, () => '<div class="skeleton"></div>').join('');
  $('#empty').style.display = 'none';
  try {
    const j = await api('/api/files' + (force ? '?refresh=1' : ''));
    state.items = j.items || [];
    state.sel.clear();
    render();
  } catch (e) {
    grid.innerHTML = '';
    $('#empty').style.display = 'block';
    $('#empty').textContent = '读取列表失败：' + e.message;
  }
}

function visible() {
  return state.items.filter(f =>
    (state.kind === 'all' || f.type === state.kind) &&
    (!state.q || f.path.toLowerCase().includes(state.q.toLowerCase())));
}

function render() {
  const list = visible();
  const grid = $('#grid');
  $('#count').textContent = `${list.length} / ${state.items.length} 个文件`;
  $('#btnDownloadSel').disabled = state.sel.size === 0;
  $('#btnDownloadSel').textContent = state.sel.size ? `下载选中 (${state.sel.size})` : '下载选中';
  if (!state.items.length) {
    grid.innerHTML = '';
    $('#empty').style.display = 'block';
    $('#empty').textContent = '相机里没有文件。';
    return;
  }
  if (!list.length) {
    grid.innerHTML = '';
    $('#empty').style.display = 'block';
    $('#empty').textContent = '没有匹配的文件。';
    return;
  }
  $('#empty').style.display = 'none';
  grid.innerHTML = list.map((f, i) => {
    const name = f.path.split('/').pop();
    const sel = state.sel.has(f.path);
    const isVideo = f.type === 'video';
    return `<div class="card ${sel ? 'sel' : ''}" data-path="${esc(f.path)}" data-i="${i}">
      <div class="thumb" data-thumb="${esc(f.path)}">
        ${window.__ph(isVideo)}
        <img loading="lazy" alt="" src="/api/thumb?path=${encodeURIComponent(f.path)}&v=${f.size || 0}"
             onload="this.parentNode.classList.add('ok')" onerror="this.remove()">
        ${isVideo ? '<span class="badge">视频</span>' : ''}
        <div class="pick">✓</div>
      </div>
      <div class="meta">
        <div class="name" title="${esc(f.path)}">${esc(name)}</div>
        <div class="line2"><span>${bytes(f.size)}${f.type === 'video' && fmtDur(f.time) ? ' · ' + fmtDur(f.time) : ''}</span><span>${esc((f.create || '').slice(0, 16))}</span></div>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', (ev) => {
      const path = card.dataset.path;
      if (ev.metaKey || ev.shiftKey || ev.altKey) {
        ev.preventDefault();
        toggleSel(path, card);
        return;
      }
      openLightbox(path);
    });
    card.querySelector('.pick').addEventListener('click', (ev) => {
      ev.stopPropagation();
      toggleSel(card.dataset.path, card);
    });
  });
}

function toggleSel(path, card) {
  if (state.sel.has(path)) state.sel.delete(path); else state.sel.add(path);
  card.classList.toggle('sel', state.sel.has(path));
  $('#btnDownloadSel').disabled = state.sel.size === 0;
  $('#btnDownloadSel').textContent = state.sel.size ? `下载选中 (${state.sel.size})` : '下载选中';
}

/* ---------------- 下载 ---------------- */
function download(path) {
  const a = document.createElement('a');
  a.href = '/api/download?path=' + encodeURIComponent(path);
  a.download = path.split('/').pop();
  document.body.appendChild(a);
  a.click();
  a.remove();
}

// 下载前先握手确认能取到，失败就给出具体原因，而不是让浏览器跳到一个坏链接
async function safeDownload(path) {
  const name = path.split('/').pop();
  try {
    const c = await api('/api/check?path=' + encodeURIComponent(path));
    if (c.ok) { download(path); return true; }
    showFailure(name, c);
    return false;
  } catch (e) {
    showFailure(name, { error: e.message });
    return false;
  }
}

function showFailure(name, detail) {
  toast(`${name} 取不到：${detail.error || '两条通道都失败'}`, 4000);
  openDiag(detail);
}
async function downloadMany(paths) {
  if (!paths.length) return;
  toast(`开始下载 ${paths.length} 个文件，浏览器可能询问是否允许多个下载…`, 3200);
  let ok = 0, bad = 0;
  for (let i = 0; i < paths.length; i++) {
    const good = await safeDownload(paths[i]);
    good ? ok++ : bad++;
    if (paths.length > 1) toast(`下载 ${i + 1}/${paths.length}：${paths[i].split('/').pop()}`, 1200);
    await new Promise(r => setTimeout(r, 800));
  }
  if (bad) toast(`完成 ${ok} 个，失败 ${bad} 个 —— 点「诊断」看原因`, 4000);
}

/* ---------------- 灯箱 ---------------- */
function findItem(path) { return state.items.find(f => f.path === path); }

function openLightbox(path) {
  const list = visible();
  state.lbIndex = list.findIndex(f => f.path === path);
  renderLightbox(path);
  $('#lightbox').classList.add('on');
}
function renderLightbox(path) {
  const f = findItem(path);
  if (!f) return;
  const name = f.path.split('/').pop();
  $('#lbTitle').textContent = `${name} · ${bytes(f.size)}` +
    (f.type === 'video' && fmtDur(f.time) ? ` · ${fmtDur(f.time)}` : '');
  const url = '/api/media?path=' + encodeURIComponent(f.path);
  $('#lbBody').innerHTML = f.type === 'video'
    ? `<video src="${url}" controls autoplay playsinline></video>`
    : `<img src="${url}" alt="${esc(name)}">`;
  $('#lbDownload').onclick = () => safeDownload(f.path);

  const box = $('#lbBody');
  const fallback = (msg) => {
    box.innerHTML = `<div style="background:var(--panel);color:var(--text);padding:26px 30px;border-radius:12px;
        max-width:520px;text-align:center;line-height:1.7">
        <div style="font-size:15px;font-weight:600;margin-bottom:8px">预览不了</div>
        <div class="sub">${esc(msg)}</div>
        <div style="margin-top:16px"><button class="primary" id="lbRetryDownload">下载这个文件</button></div>
      </div>`;
    const b = document.querySelector('#lbRetryDownload');
    if (b) b.onclick = () => safeDownload(f.path);
  };
  const media = box.querySelector('img,video');
  if (media) {
    media.addEventListener('error', () => fallback(
      f.type === 'video'
        ? '浏览器可能不支持该视频编码（相机常拍 H.265）。可以先下载，再用 QuickTime / IINA 播放。'
        : '相机没有返回这张图，或返回的不是图片格式。'));
  }
}
function stepLightbox(d) {
  const list = visible();
  if (!list.length) return;
  state.lbIndex = (state.lbIndex + d + list.length) % list.length;
  renderLightbox(list[state.lbIndex].path);
}

/* ---------------- 事件 ---------------- */
$('#seg').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-k]'); if (!b) return;
  state.kind = b.dataset.k;
  [...$('#seg').children].forEach(x => x.classList.toggle('active', x === b));
  render();
});
$('#q').addEventListener('input', (e) => { state.q = e.target.value.trim(); render(); });
$('#btnRefresh').addEventListener('click', async () => {
  await refreshStatus();
  if (state.connected) { await loadFiles(true); toast('已刷新'); }
});
$('#btnSelectAll').addEventListener('click', () => {
  const list = visible();
  const all = list.every(f => state.sel.has(f.path));
  list.forEach(f => all ? state.sel.delete(f.path) : state.sel.add(f.path));
  render();
});
$('#btnDownloadSel').addEventListener('click', () => {
  if (!state.sel.size) return;
  downloadMany([...state.sel]);
});
$('#btnDownloadAll').addEventListener('click', () => {
  const list = visible();
  if (!list.length) return toast('没有可下载的文件');
  downloadMany(list.map(f => f.path));
});
$('#lbClose').addEventListener('click', () => $('#lightbox').classList.remove('on'));
$('#lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox' || e.target.className === 'box') $('#lightbox').classList.remove('on');
});
$('#navL').addEventListener('click', () => stepLightbox(-1));
$('#navR').addEventListener('click', () => stepLightbox(1));
document.addEventListener('keydown', (e) => {
  if (!$('#lightbox').classList.contains('on')) return;
  if (e.key === 'Escape') $('#lightbox').classList.remove('on');
  if (e.key === 'ArrowLeft') stepLightbox(-1);
  if (e.key === 'ArrowRight') stepLightbox(1);
});

$('#btnSettings').addEventListener('click', () => $('#settings').classList.add('on'));
$('#settings').addEventListener('click', (e) => { if (e.target.id === 'settings') $('#settings').classList.remove('on'); });
let hostSeq = 0;
$('#hostSave').addEventListener('click', async () => {
  const host = $('#hostInput').value.trim();
  const my = ++hostSeq;
  $('#hostState').textContent = '连接中…（最多等 2 秒）';
  $('#hostSave').disabled = true;
  try {
    const j = await api('/api/host', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ host })
    });
    if (my !== hostSeq) return;                       // 只认最后一次请求
    $('#hostState').textContent = j.connected ? `已连接：${j.name || j.host}` : '连接失败：' + (j.error || '未知错误');
    if (j.connected) { $('#settings').classList.remove('on'); await refreshStatus(); await loadFiles(true); }
  } catch (e) {
    if (my === hostSeq) $('#hostState').textContent = '失败：' + e.message;
  } finally {
    if (my === hostSeq) $('#hostSave').disabled = false;
  }
});

async function openDiag(extra) {
  $('#diag').classList.add('on');
  $('#diagOut').textContent = '诊断中…（相机慢的话要几秒）';
  $('#diagHint').textContent = '探测 → 列表 → 8080 握手 → HTTP 取文件，逐条看哪步失败。';
  try {
    const j = await api('/api/diag');
    const out = extra ? { lastError: extra, diag: j } : j;
    $('#diagOut').textContent = JSON.stringify(out, null, 2);
    const bad = (j.steps || []).filter(s => !s.ok);
    $('#diagHint').textContent = bad.length
      ? `有 ${bad.length} 步失败：${bad.map(s => s.step).join('、')}`
      : '全部步骤正常。';
  } catch (e) {
    $('#diagOut').textContent = '诊断失败：' + e.message;
  }
}
$('#btnDiag').addEventListener('click', () => openDiag());
$('#diagClose').addEventListener('click', () => $('#diag').classList.remove('on'));
$('#diag').addEventListener('click', (e) => { if (e.target.id === 'diag') $('#diag').classList.remove('on'); });
$('#diagAgain').addEventListener('click', () => openDiag());
$('#diagCopy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('#diagOut').textContent); toast('已复制'); }
  catch (e) { toast('复制失败，请手动选中'); }
});

$('#btnPreview').addEventListener('click', async () => {
  try {
    const c = await api('/api/config');
    if (!c.rtsp) return toast('先连上相机');
    let copied = false;
    try { await navigator.clipboard.writeText(c.rtsp); copied = true; } catch (e) {}
    toast((copied ? 'RTSP 已复制：' : 'RTSP：') + c.rtsp + '  （用 IINA / ffplay 打开）', 5000);
  } catch (e) { toast('取预览地址失败：' + e.message); }
});

/* ---------------- 启动 ---------------- */
(async function boot() {
  await refreshStatus();
  if (state.connected) await loadFiles(true);
  setInterval(refreshStatus, 8000);
})();
</script>
</body>
</html>
